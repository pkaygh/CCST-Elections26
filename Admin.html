<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap');
    
    :root {
      --hotel-gold: #C9A84C;
      --hotel-dark: #1A1A2E;
      --hotel-navy: #16213E;
      --hotel-maroon: #8B1A1A;
      --hotel-cream: #F5F0E8;
      --hotel-shadow: 0 8px 32px rgba(0,0,0,0.12);
      --hotel-border-radius: 16px;
    }

    * { font-family: 'Inter', sans-serif; }
    
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      padding: 2rem;
    }

    .hotel-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .hotel-header {
      text-align: center;
      padding: 2.5rem 2rem;
      background: linear-gradient(145deg, rgba(26,26,46,0.95), rgba(22,33,62,0.95));
      border-radius: var(--hotel-border-radius);
      border: 1px solid rgba(201,168,76,0.2);
      box-shadow: var(--hotel-shadow);
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hotel-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.3;
    }

    .hotel-header .logo-icon {
      font-size: 3rem;
      color: var(--hotel-gold);
      margin-bottom: 0.5rem;
    }

    .hotel-header h1 {
      font-family: 'Playfair Display', serif;
      color: #fff;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      position: relative;
    }

    .hotel-header h1 span {
      color: var(--hotel-gold);
    }

    .hotel-header .subtitle {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      position: relative;
    }

    .gold-divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--hotel-gold), transparent);
      margin: 0.8rem auto;
    }

    .hotel-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--hotel-border-radius);
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: var(--hotel-shadow);
      transition: all 0.3s ease;
    }

    .hotel-card:hover {
      border-color: rgba(201,168,76,0.3);
      transform: translateY(-2px);
    }

    .hotel-card .card-title {
      font-family: 'Playfair Display', serif;
      color: #fff;
      font-size: 1.3rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .hotel-card .card-title i {
      color: var(--hotel-gold);
    }

    .gold-badge {
      background: linear-gradient(135deg, var(--hotel-gold), #a8883a);
      color: #fff;
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hotel-input {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      padding: 0.8rem 1.2rem;
      transition: all 0.3s ease;
      width: 100%;
    }

    .hotel-input:focus {
      background: rgba(255,255,255,0.1);
      border-color: var(--hotel-gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.15);
      color: #fff;
      outline: none;
    }

    .hotel-input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    .hotel-label {
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 0.4rem;
      display: block;
    }

    .btn-hotel-primary {
      background: linear-gradient(135deg, var(--hotel-gold), #a8883a);
      border: none;
      color: #1A1A2E;
      font-weight: 600;
      padding: 0.9rem 2rem;
      border-radius: 12px;
      transition: all 0.3s ease;
      width: 100%;
      letter-spacing: 1px;
    }

    .btn-hotel-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(201,168,76,0.3);
      color: #1A1A2E;
    }

    .btn-hotel-secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-weight: 500;
      padding: 0.9rem 2rem;
      border-radius: 12px;
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn-hotel-secondary:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    .btn-hotel-danger {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      border: none;
      color: #fff;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .btn-hotel-danger:hover {
      transform: scale(1.05);
      color: #fff;
    }

    .btn-hotel-warning {
      background: linear-gradient(135deg, #f39c12, #e67e22);
      border: none;
      color: #fff;
      padding: 0.4rem 1rem;
      border-radius: 8px;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .btn-hotel-warning:hover {
      transform: scale(1.05);
      color: #fff;
    }

    .candidate-item {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      margin-bottom: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
    }

    .candidate-item:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(201,168,76,0.2);
    }

    .candidate-item .candidate-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .candidate-item .candidate-img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(201,168,76,0.3);
    }

    .candidate-item .candidate-name {
      color: #fff;
      font-weight: 500;
      font-size: 1.05rem;
    }

    .candidate-item .candidate-program {
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
    }

    .candidate-item .candidate-actions {
      display: flex;
      gap: 0.5rem;
    }

    .position-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.2rem;
      background: rgba(201,168,76,0.1);
      border-radius: 12px;
      margin-bottom: 1rem;
      border-left: 3px solid var(--hotel-gold);
    }

    .position-header h6 {
      color: #fff;
      font-weight: 600;
      margin: 0;
      font-size: 1.1rem;
    }

    .position-header .position-badge {
      background: rgba(201,168,76,0.2);
      color: var(--hotel-gold);
      padding: 0.2rem 0.8rem;
      border-radius: 50px;
      font-size: 0.7rem;
    }

    .auth-message {
      color: #e74c3c;
      font-weight: 500;
      margin-top: 0.8rem;
      text-align: center;
    }

    .success-message {
      color: #2ecc71;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--hotel-gold);
      border-radius: 10px;
    }

    @media (max-width: 768px) {
      body { padding: 1rem; }
      .hotel-header h1 { font-size: 1.5rem; }
      .hotel-card { padding: 1.2rem; }
      .candidate-item { flex-wrap: wrap; gap: 0.8rem; }
      .candidate-item .candidate-actions { width: 100%; justify-content: flex-end; }
      .candidate-item .candidate-img { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>

<div class="hotel-container">
  
  <div class="hotel-header">
    <div class="logo-icon"><i class="bi bi-building"></i></div>
    <h1>CCST <span>Elections</span></h1>
    <div class="gold-divider"></div>
    <p class="subtitle">Executive Control Suite</p>
  </div>

  <div id="authCard" class="hotel-card">
    <div class="card-title">
      <i class="bi bi-shield-lock"></i> Electoral Officer Login
    </div>
    <div class="mb-3">
      <label class="hotel-label"><i class="bi bi-key me-1"></i> Admin Passcode</label>
      <input type="password" id="adminPassword" class="form-control hotel-input" placeholder="Enter secure passcode">
    </div>
    <button onclick="unlockPanel()" class="btn-hotel-primary">
      <i class="bi bi-unlock me-2"></i>Unlock Admin Panel
    </button>
    <div id="authMsg" class="auth-message"></div>
  </div>

  <div id="adminPanel" class="d-none">
    
    <div class="hotel-card">
      <div class="card-title">
        <i class="bi bi-person-plus"></i> 
        <span id="formTitle">Add Contender</span>
        <span class="gold-badge ms-auto"><i class="bi bi-check-circle-fill me-1"></i>Authenticated</span>
      </div>

      <form id="adminForm">
        <input type="hidden" id="editRowIndex" value="">
        
        <div class="mb-3">
          <label class="hotel-label"><i class="bi bi-tag me-1"></i> Position Title</label>
          <input type="text" id="pos" class="form-control hotel-input" placeholder="e.g. SRC President" required>
        </div>
        
        <div class="mb-3">
          <label class="hotel-label"><i class="bi bi-person me-1"></i> Candidate Full Name</label>
          <input type="text" id="cName" class="form-control hotel-input" placeholder="e.g. Kwame Mensah" required>
        </div>
        
        <div class="mb-3">
          <label class="hotel-label"><i class="bi bi-mortarboard me-1"></i> Programme of Study</label>
          <input type="text" id="cProg" class="form-control hotel-input" placeholder="e.g. BSc Nursing" required>
        </div>

        <div class="mb-4" id="fileUploadGroup">
          <label class="hotel-label"><i class="bi bi-image me-1"></i> Upload Candidate Picture</label>
          <input type="file" id="cImgFile" class="form-control hotel-input" accept="image/*">
        </div>

        <button type="submit" id="submitBtn" class="btn-hotel-primary">
          <i class="bi bi-plus-circle me-2"></i>Add Candidate
        </button>
        
        <button type="button" id="cancelBtn" class="btn-hotel-secondary mt-2 d-none" onclick="resetAdminForm()">
          <i class="bi bi-x-circle me-2"></i>Cancel Edit
        </button>
      </form>

      <div id="adminMsg" class="auth-message"></div>
    </div>

    <div class="hotel-card">
      <div class="card-title">
        <i class="bi bi-list-ul"></i> Manage Candidates
        <span class="gold-badge ms-auto"><i class="bi bi-people me-1"></i>Directory</span>
      </div>
      <div id="candidateList" style="color: rgba(255,255,255,0.6);">Loading candidates...</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
  let activePasscode = "";

  async function unlockPanel() {
    const pwd = document.getElementById('adminPassword').value;
    const result = await checkAdminPassword(pwd);
    
    if (result.success && result.data === true) {
      activePasscode = pwd;
      document.getElementById('authCard').classList.add('d-none');
      document.getElementById('adminPanel').classList.remove('d-none');
      loadCandidates();
    } else {
      document.getElementById('authMsg').innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i>Incorrect admin passcode.';
    }
  }

  async function loadCandidates() {
    const result = await getAdminCandidateList();
    if (result.success) {
      renderCandidatesList(result.data);
    } else {
      document.getElementById('candidateList').innerHTML = `<p style="color:#e74c3c;">Failed to load: ${result.message}</p>`;
    }
  }

  function renderCandidatesList(list) {
    const container = document.getElementById('candidateList');
    if (!list || list.length === 0) {
      container.innerHTML = '<p style="text-align:center;padding:2rem 0;"><i class="bi bi-inbox" style="font-size:2rem;display:block;margin-bottom:0.5rem;opacity:0.3;"></i>No candidates registered yet.</p>';
      return;
    }

    const grouped = {};
    list.forEach(c => {
      if (!grouped[c.position]) grouped[c.position] = [];
      grouped[c.position].push(c);
    });

    let html = '';
    Object.keys(grouped).forEach(pos => {
      html += `
        <div style="margin-bottom:1.5rem;">
          <div class="position-header">
            <h6><i class="bi bi-trophy me-2" style="color:var(--hotel-gold);"></i>${pos}</h6>
            <span class="position-badge">${grouped[pos].length} candidate${grouped[pos].length > 1 ? 's' : ''}</span>
          </div>`;

      grouped[pos].forEach(c => {
        html += `
          <div class="candidate-item">
            <div class="candidate-info">
              <img src="${c.img || 'https://via.placeholder.com/60'}" class="candidate-img" alt="${c.name}">
              <div>
                <div class="candidate-name">${c.name}</div>
                <div class="candidate-program"><i class="bi bi-book me-1"></i>${c.program}</div>
              </div>
            </div>
            <div class="candidate-actions">
              <button class="btn-hotel-warning" onclick="startEdit(${c.rowIndex}, '${c.position}', '${c.name}', '${c.program}')">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn-hotel-danger" onclick="removeCandidate(${c.rowIndex})">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>`;
      });

      html += `
          <div style="text-align:right;margin-top:0.5rem;">
            <button class="btn-hotel-danger" onclick="removePosition('${pos}')" style="padding:0.3rem 1rem;font-size:0.75rem;">
              <i class="bi bi-folder-minus me-1"></i>Delete Position
            </button>
          </div>
        </div>`;
    });

    container.innerHTML = html;
  }

  document.getElementById('adminForm').onsubmit = async function(e) {
    e.preventDefault();
    const rowIndex = document.getElementById('editRowIndex').value;
    const position = document.getElementById('pos').value;
    const name = document.getElementById('cName').value;
    const program = document.getElementById('cProg').value;
    
    if (rowIndex) {
      const result = await updateCandidate(activePasscode, parseInt(rowIndex), position, name, program);
      document.getElementById('adminMsg').innerHTML = result.success 
        ? `<i class="bi bi-check-circle-fill me-2" style="color:#2ecc71;"></i>${result.message}`
        : `<i class="bi bi-exclamation-triangle-fill me-2" style="color:#e74c3c;"></i>${result.message}`;
      if (result.success) {
        resetAdminForm();
        loadCandidates();
      }
    } else {
      const fileInput = document.getElementById('cImgFile');
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = async function(evt) {
          const result = await addCandidateWithFile(activePasscode, position, name, program, { base64: evt.target.result, fileName: file.name });
          document.getElementById('adminMsg').innerHTML = result.success 
            ? `<i class="bi bi-check-circle-fill me-2" style="color:#2ecc71;"></i>${result.message}`
            : `<i class="bi bi-exclamation-triangle-fill me-2" style="color:#e74c3c;"></i>${result.message}`;
          if (result.success) {
            resetAdminForm();
            loadCandidates();
          }
        };
        reader.readAsDataURL(file);
      } else {
        const result = await addCandidateWithFile(activePasscode, position, name, program, null);
        document.getElementById('adminMsg').innerHTML = result.success 
          ? `<i class="bi bi-check-circle-fill me-2" style="color:#2ecc71;"></i>${result.message}`
          : `<i class="bi bi-exclamation-triangle-fill me-2" style="color:#e74c3c;"></i>${result.message}`;
        if (result.success) {
          resetAdminForm();
          loadCandidates();
        }
      }
    }
  };

  function startEdit(rowIndex, pos, name, prog) {
    document.getElementById('editRowIndex').value = rowIndex;
    document.getElementById('pos').value = pos;
    document.getElementById('cName').value = name;
    document.getElementById('cProg').value = prog;
    
    document.getElementById('formTitle').innerText = "Edit Candidate";
    document.getElementById('submitBtn').innerHTML = '<i class="bi bi-save me-2"></i>Save Changes';
    document.getElementById('fileUploadGroup').classList.add('d-none');
    document.getElementById('cancelBtn').classList.remove('d-none');
  }

  function resetAdminForm() {
    document.getElementById('adminForm').reset();
    document.getElementById('editRowIndex').value = '';
    document.getElementById('formTitle').innerText = "Add Contender";
    document.getElementById('submitBtn').innerHTML = '<i class="bi bi-plus-circle me-2"></i>Add Candidate';
    document.getElementById('fileUploadGroup').classList.remove('d-none');
    document.getElementById('cancelBtn').classList.add('d-none');
  }

  async function removeCandidate(rowIndex) {
    if (confirm("Are you sure you want to delete this candidate?")) {
      const result = await deleteCandidate(activePasscode, rowIndex);
      alert(result.message);
      if (result.success) loadCandidates();
    }
  }

  async function removePosition(posName) {
    if (confirm(`Delete entire position "${posName}" and all its candidates?`)) {
      const result = await deletePosition(activePasscode, posName);
      alert(result.message);
      if (result.success) loadCandidates();
    }
  }
</script>
</body>
</html>
