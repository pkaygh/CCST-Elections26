<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 600px;">
  <h3 class="mb-4">Elections Admin Control Panel</h3>
  <div class="card shadow-sm p-4">
    <h5>Add Contender / Position</h5>
    <form id="adminForm">
      <div class="mb-3">
        <label class="form-label">Position Title</label>
        <input type="text" id="pos" class="form-control" placeholder="e.g. SRC President" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Candidate Full Name</label>
        <input type="text" id="cName" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Programme of Study</label>
        <input type="text" id="cProg" class="form-control" placeholder="e.g. BSc Nursing" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Image URL (Google Drive / Direct Link)</label>
        <input type="url" id="cImg" class="form-control" placeholder="https://..." required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Add Candidate</button>
    </form>
    <div id="adminMsg" class="mt-3 text-success fw-bold"></div>
  </div>
</div>
<script>
  document.getElementById('adminForm').onsubmit = function(e) {
    e.preventDefault();
    google.script.run.withSuccessHandler(res => {
      document.getElementById('adminMsg').innerText = res;
      document.getElementById('adminForm').reset();
    }).addCandidate(
      document.getElementById('pos').value,
      document.getElementById('cName').value,
      document.getElementById('cProg').value,
      document.getElementById('cImg').value
    );
  };
</script>
</body>
</html>
