<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .avatar { width: 50px; height: 50px; object-fit: cover; border-radius: 50%; }
  </style>
</head>
<body class="bg-dark text-white p-4">
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>CCST Real-time Election Results</h2>
    <span class="badge bg-danger pulse">LIVE POLLS</span>
  </div>

  <div id="dashboard">Loading tally data...</div>
</div>

<script>
  function fetchTally() {
    google.script.run.withSuccessHandler(renderResults).getRealtimeTally();
  }

  function renderResults(tallies) {
    const dash = document.getElementById('dashboard');
    dash.innerHTML = '';

    Object.keys(tallies).forEach(pos => {
      const positionData = tallies[pos];
      const contendersCount = Object.keys(positionData.candidates).length;
      
      let html = `<div class="card bg-secondary text-white mb-4 shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h4 class="m-0">${pos}</h4>
          <span class="badge bg-info">${contendersCount} Contender(s) | Total Votes: ${positionData.totalVotes}</span>
        </div>
        <div class="card-body">`;

      Object.keys(positionData.candidates).forEach(candName => {
        const cand = positionData.candidates[candName];
        const percent = positionData.totalVotes > 0 ? ((cand.count / positionData.totalVotes) * 100).toFixed(1) : 0;

        html += `
          <div class="mb-3">
            <div class="d-flex align-items-center mb-1">
              <img src="${cand.img || 'https://via.placeholder.com/50'}" class="avatar me-3">
              <div class="flex-grow-1">
                <div class="d-flex justify-content-between">
                  <span class="fw-bold fs-5">${candName} <small class="text-light opacity-75">(${cand.program})</small></span>
                  <span class="fw-bold fs-5">${cand.count} Votes (${percent}%)</span>
                </div>
                <div class="progress mt-1" style="height: 15px;">
                  <div class="progress-bar bg-success" style="width: ${percent}%"></div>
                </div>
              </div>
            </div>
          </div>`;
      });

      html += `</div></div>`;
      dash.innerHTML += html;
    });
  }

  // Poll every 5 seconds for real-time live updates
  setInterval(fetchTally, 5000);
  window.onload = fetchTally;
</script>
</body>
</html>
