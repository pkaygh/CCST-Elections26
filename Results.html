<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap');

    :root {
      --hotel-gold: #C9A84C;
      --hotel-dark: #1A1A2E;
      --hotel-border-radius: 16px;
    }

    * { font-family: 'Inter', sans-serif; }

    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      padding: 2rem;
    }

    .hotel-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .hotel-header {
      text-align: center;
      padding: 2.5rem 2rem;
      background: linear-gradient(145deg, rgba(26,26,46,0.95), rgba(22,33,62,0.95));
      border-radius: var(--hotel-border-radius);
      border: 1px solid rgba(201,168,76,0.2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      margin-bottom: 2rem;
      position: relative;
      overflow: hidden;
    }

    .hotel-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.3;
    }

    .hotel-header .logo-icon {
      font-size: 3rem;
      color: var(--hotel-gold);
      margin-bottom: 0.5rem;
    }

    .hotel-header h1 {
      font-family: 'Playfair Display', serif;
      color: #fff;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      position: relative;
    }

    .hotel-header h1 span {
      color: var(--hotel-gold);
    }

    .hotel-header .subtitle {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      position: relative;
    }

    .gold-divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--hotel-gold), transparent);
      margin: 0.8rem auto;
    }

    .live-badge {
      display: inline-block;
      background: #e74c3c;
      color: #fff;
      padding: 0.3rem 1.2rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .live-badge i {
      margin-right: 0.5rem;
    }

    .result-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--hotel-border-radius);
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    }

    .result-card .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .result-card .result-header h3 {
      font-family: 'Playfair Display', serif;
      color: #fff;
      font-size: 1.3rem;
      margin: 0;
    }

    .result-card .result-header .total-badge {
      background: rgba(201,168,76,0.15);
      color: var(--hotel-gold);
      padding: 0.3rem 1rem;
      border-radius: 50px;
      font-size: 0.8rem;
    }

    .candidate-result {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem;
      border-radius: 12px;
      margin-bottom: 0.6rem;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.03);
    }

    .candidate-result:hover {
      background: rgba(255,255,255,0.06);
    }

    .candidate-result .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(201,168,76,0.2);
      flex-shrink: 0;
    }

    .candidate-result .result-info {
      flex: 1;
    }

    .candidate-result .result-info .cand-name {
      color: #fff;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .candidate-result .result-info .cand-program {
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
    }

    .candidate-result .result-stats {
      text-align: right;
      flex-shrink: 0;
    }

    .candidate-result .result-stats .votes {
      color: var(--hotel-gold);
      font-weight: 600;
      font-size: 1rem;
    }

    .candidate-result .result-stats .percent {
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
    }

    .progress-hotel {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-hotel .progress-bar {
      height: 100%;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--hotel-gold), #e8c84c);
      transition: width 0.5s ease;
    }

    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 4rem 0;
      color: rgba(255,255,255,0.3);
    }

    .loading-spinner i {
      font-size: 2.5rem;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .no-data {
      text-align: center;
      padding: 4rem 0;
      color: rgba(255,255,255,0.2);
    }

    .no-data i {
      font-size: 3rem;
      display: block;
      margin-bottom: 1rem;
    }

    .top-performer {
      border-left: 3px solid var(--hotel-gold);
      background: rgba(201,168,76,0.06);
    }

    .vote-none-row {
      border-left: 3px solid #e74c3c;
      background: rgba(231,76,60,0.05);
    }

    .vote-none-row .votes {
      color: #e74c3c !important;
    }

    @media (max-width: 768px) {
      body { padding: 1rem; }
      .hotel-header h1 { font-size: 1.5rem; }
      .result-card { padding: 1rem; }
      .candidate-result { flex-wrap: wrap; }
      .candidate-result .result-stats { width: 100%; text-align: left; }
      .candidate-result .avatar { width: 48px; height: 48px; }
    }
  </style>
</head>
<body>

<div class="hotel-container">
  
  <div class="hotel-header">
    <div class="logo-icon"><i class="bi bi-building"></i></div>
    <h1>CCST <span>Elections</span></h1>
    <div class="gold-divider"></div>
    <p class="subtitle">Live Results Dashboard</p>
    <div style="margin-top:1rem;">
      <span class="live-badge"><i class="bi bi-circle-fill"></i>Live</span>
    </div>
  </div>

  <div id="dashboard">
    <div class="loading-spinner">
      <i class="bi bi-hourglass-split"></i>
      <span style="margin-left:1rem;">Loading results...</span>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
  let lastData = null;

  async function fetchTally() {
    const result = await getRealtimeTally();
    if (result.success) {
      renderResults(result.data);
    } else {
      document.getElementById('dashboard').innerHTML = `
        <div class="no-data">
          <i class="bi bi-exclamation-triangle"></i>
          <p style="color:#e74c3c;">Failed to load results: ${result.message}</p>
        </div>
      `;
    }
  }

  function renderResults(tallies) {
    const dash = document.getElementById('dashboard');
    lastData = tallies;
    
    if (!tallies || Object.keys(tallies).length === 0) {
      dash.innerHTML = `
        <div class="no-data">
          <i class="bi bi-inbox"></i>
          <p>No voting data available yet.</p>
        </div>
      `;
      return;
    }

    dash.innerHTML = '';

    Object.keys(tallies).forEach(pos => {
      const positionData = tallies[pos];
      const candidates = Object.keys(positionData.candidates);
      
      let topVotes = 0;
      candidates.forEach(c => {
        if (positionData.candidates[c].count > topVotes) {
          topVotes = positionData.candidates[c].count;
        }
      });

      let html = `
        <div class="result-card">
          <div class="result-header">
            <h3><i class="bi bi-trophy me-2" style="color:var(--hotel-gold);"></i>${pos}</h3>
            <span class="total-badge">
              <i class="bi bi-people me-1"></i>${candidates.length} candidate${candidates.length > 1 ? 's' : ''} • ${positionData.totalVotes} votes
            </span>
          </div>
      `;

      candidates.forEach(candName => {
        const cand = positionData.candidates[candName];
        const percent = positionData.totalVotes > 0 
          ? ((cand.count / positionData.totalVotes) * 100).toFixed(1) 
          : 0;
        const isTop = cand.count === topVotes && topVotes > 0;

        html += `
          <div class="candidate-result ${isTop ? 'top-performer' : ''}">
            <img src="${cand.img || 'https://via.placeholder.com/64'}" class="avatar" alt="${candName}">
            <div class="result-info">
              <div class="cand-name">
                ${candName}
                ${isTop ? '<i class="bi bi-crown ms-2" style="color:var(--hotel-gold);"></i>' : ''}
              </div>
              <div class="cand-program"><i class="bi bi-book me-1"></i>${cand.program}</div>
              <div class="progress-hotel">
                <div class="progress-bar" style="width: ${percent}%;"></div>
              </div>
            </div>
            <div class="result-stats">
              <div class="votes">${cand.count}</div>
              <div class="percent">${percent}%</div>
            </div>
          </div>
        `;
      });

      // Show "Vote for None" count if it exists
      if (positionData.noneCount && positionData.noneCount > 0) {
        const nonePercent = positionData.totalVotes > 0 
          ? ((positionData.noneCount / positionData.totalVotes) * 100).toFixed(1) 
          : 0;
        html += `
          <div class="candidate-result vote-none-row">
            <div class="avatar" style="display:flex;align-items:center;justify-content:center;background:rgba(231,76,60,0.1);font-size:1.5rem;color:#e74c3c;">
              <i class="bi bi-x-circle"></i>
            </div>
            <div class="result-info">
              <div class="cand-name" style="color:#e74c3c;">
                Voted None (Abstained)
              </div>
              <div class="cand-program">Voter chose not to vote</div>
              <div class="progress-hotel">
                <div class="progress-bar" style="width: ${nonePercent}%;background:linear-gradient(90deg,#e74c3c,#c0392b);"></div>
              </div>
            </div>
            <div class="result-stats">
              <div class="votes">${positionData.noneCount}</div>
              <div class="percent">${nonePercent}%</div>
            </div>
          </div>
        `;
      }

      html += `</div>`;
      dash.innerHTML += html;
    });
  }

  // Auto-refresh every 5 seconds
  setInterval(fetchTally, 5000);
  window.onload = fetchTally;
</script>
</body>
</html>
