<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CCST Elections — SRC Executive Declaration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap');
    :root { --hotel-gold: #C9A84C; --hotel-dark: #1A1A2E; --hotel-border-radius: 16px; }
    * { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; padding: 2rem; }
    .hotel-container { max-width: 1000px; margin: 0 auto; }

    .celebration-banner { 
      background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
      border: 2px solid var(--hotel-gold);
      border-radius: var(--hotel-border-radius);
      padding: 2rem 2rem 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: glowPulse 3s ease-in-out infinite;
    }
    .celebration-banner::before {
      content: '🏆';
      position: absolute;
      font-size: 8rem;
      opacity: 0.05;
      top: -20px;
      right: -20px;
      transform: rotate(15deg);
    }
    .celebration-banner::after {
      content: '🎉';
      position: absolute;
      font-size: 6rem;
      opacity: 0.05;
      bottom: -10px;
      left: -10px;
      transform: rotate(-10deg);
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(201,168,76,0.1); }
      50% { box-shadow: 0 0 60px rgba(201,168,76,0.2); }
    }
    .celebration-banner .crown-icon { font-size: 3rem; color: var(--hotel-gold); display: block; margin-bottom: 0.2rem; }
    .celebration-banner h2 { 
      font-family: 'Playfair Display', serif; 
      color: #fff; 
      font-size: 2.2rem; 
      font-weight: 900;
      letter-spacing: 1px;
    }
    .celebration-banner h2 span { color: var(--hotel-gold); }
    .celebration-banner .sub-celebrate { 
      color: rgba(255,255,255,0.6); 
      font-size: 1rem; 
      letter-spacing: 3px; 
      text-transform: uppercase;
    }
    .celebration-banner .confetti-line {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.8rem;
      font-size: 1.5rem;
    }

    .hotel-header { text-align: center; padding: 2rem 2rem; background: linear-gradient(145deg, rgba(26,26,46,0.95), rgba(22,33,62,0.95)); border-radius: var(--hotel-border-radius); border: 1px solid rgba(201,168,76,0.2); box-shadow: 0 8px 32px rgba(0,0,0,0.12); margin-bottom: 2rem; position: relative; overflow: hidden; }
    .hotel-header::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); opacity: 0.3; }
    .hotel-header .logo-icon { font-size: 2.5rem; color: var(--hotel-gold); margin-bottom: 0.3rem; }
    .hotel-header h1 { font-family: 'Playfair Display', serif; color: #fff; font-size: 2rem; font-weight: 700; letter-spacing: 2px; position: relative; }
    .hotel-header h1 span { color: var(--hotel-gold); }
    .hotel-header .subtitle { color: rgba(255,255,255,0.5); font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; position: relative; }
    .gold-divider { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--hotel-gold), transparent); margin: 0.5rem auto; }

    .result-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--hotel-border-radius); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
    .result-card .result-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem; }
    .result-card .result-header h3 { font-family: 'Playfair Display', serif; color: #fff; font-size: 1.2rem; margin: 0; }
    .result-card .result-header .total-badge { background: rgba(201,168,76,0.15); color: var(--hotel-gold); padding: 0.2rem 0.8rem; border-radius: 50px; font-size: 0.7rem; }

    .candidate-result { display: flex; align-items: center; gap: 1rem; padding: 0.6rem 0.8rem; border-radius: 12px; margin-bottom: 0.4rem; transition: all 0.3s ease; background: rgba(255,255,255,0.03); }
    .candidate-result:hover { background: rgba(255,255,255,0.06); }
    .candidate-result .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(201,168,76,0.2); flex-shrink: 0; }
    .candidate-result .result-info { flex: 1; }
    .candidate-result .result-info .cand-name { color: #fff; font-weight: 500; font-size: 0.9rem; }
    .candidate-result .result-info .cand-program { color: rgba(255,255,255,0.4); font-size: 0.75rem; }
    .candidate-result .result-stats { text-align: right; flex-shrink: 0; min-width: 70px; }
    .candidate-result .result-stats .votes { color: var(--hotel-gold); font-weight: 600; font-size: 0.95rem; }
    .candidate-result .result-stats .percent { color: rgba(255,255,255,0.4); font-size: 0.7rem; }
    .progress-hotel { height: 4px; background: rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden; margin-top: 3px; }
    .progress-hotel .progress-bar { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--hotel-gold), #e8c84c); transition: width 0.5s ease; }

    .winner-row { 
      border-left: 4px solid var(--hotel-gold); 
      background: rgba(201,168,76,0.08);
      padding: 0.8rem 1rem;
      border-radius: 12px;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .winner-row .winner-badge { 
      background: var(--hotel-gold); 
      color: #1A1A2E; 
      padding: 0.15rem 0.8rem; 
      border-radius: 50px; 
      font-size: 0.6rem; 
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .winner-row .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid var(--hotel-gold); flex-shrink: 0; }
    .winner-row .cand-name { color: #fff; font-weight: 600; font-size: 1rem; }
    .winner-row .cand-program { color: rgba(255,255,255,0.4); font-size: 0.75rem; }
    .winner-row .result-stats .votes { color: var(--hotel-gold); font-weight: 700; font-size: 1.1rem; }

    .executive-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .executive-card { 
      background: rgba(255,255,255,0.04); 
      border: 1px solid rgba(255,255,255,0.06); 
      border-radius: 14px; 
      padding: 1.2rem; 
      text-align: center;
      transition: all 0.3s ease;
    }
    .executive-card:hover { transform: translateY(-3px); border-color: rgba(201,168,76,0.2); }
    .executive-card .exec-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--hotel-gold); margin: 0 auto 0.5rem; display: block; }
    .executive-card .exec-name { color: #fff; font-weight: 600; font-size: 1rem; }
    .executive-card .exec-role { color: var(--hotel-gold); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .executive-card .exec-program { color: rgba(255,255,255,0.3); font-size: 0.7rem; }

    .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 3rem 0; color: rgba(255,255,255,0.3); }
    .loading-spinner i { font-size: 2rem; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .no-data { text-align: center; padding: 3rem 0; color: rgba(255,255,255,0.2); }
    .no-data i { font-size: 2.5rem; display: block; margin-bottom: 0.8rem; }
    .btn-secondary-sm { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 0.3rem 1rem; border-radius: 8px; font-size: 0.75rem; cursor: pointer; transition: all 0.3s ease; }
    .btn-secondary-sm:hover { background: rgba(255,255,255,0.15); color: #fff; }

    .declared-stamp { display: inline-block; background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.3); color: #2ecc71; padding: 0.2rem 1.2rem; border-radius: 50px; font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; }

    @media (max-width: 768px) { 
      body { padding: 1rem; } 
      .celebration-banner h2 { font-size: 1.5rem; }
      .celebration-banner { padding: 1.5rem 1rem; }
      .executive-grid { grid-template-columns: repeat(2, 1fr); }
      .winner-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div class="hotel-container">
  <!-- Celebration Banner -->
  <div class="celebration-banner" id="celebrationBanner" style="display:none;">
    <span class="crown-icon"><i class="bi bi-trophy-fill"></i></span>
    <h2>🎊 CONGRATULATIONS <span>SRC EXECUTIVES</span> 🎊</h2>
    <div class="gold-divider"></div>
    <p class="sub-celebrate">The newly elected student leaders of CCST</p>
    <div class="confetti-line">🎉 🏅 🎊 🏆 🎉</div>
  </div>

  <div class="hotel-header">
    <div class="logo-icon"><i class="bi bi-building"></i></div>
    <h1>CCST <span>Elections</span></h1>
    <div class="gold-divider"></div>
    <p class="subtitle">Official Declaration of Results</p>
    <div style="margin-top:0.8rem;">
      <span class="declared-stamp"><i class="bi bi-check-circle me-1"></i>Declared</span>
    </div>
  </div>

  <!-- Executive Team Display -->
  <div id="executiveTeam" style="display:none;">
    <div class="result-card" style="border: 1px solid rgba(201,168,76,0.15);">
      <div class="result-header">
        <h3><i class="bi bi-people-fill me-2" style="color:var(--hotel-gold);"></i>New SRC Executive Team</h3>
        <span class="total-badge"><i class="bi bi-star-fill me-1"></i>Elected</span>
      </div>
      <div class="executive-grid" id="executiveGrid"></div>
    </div>
  </div>

  <!-- Full Results -->
  <div id="declarationContainer">
    <div class="loading-spinner">
      <i class="bi bi-hourglass-split"></i>
      <span style="margin-left:1rem;">Loading declaration...</span>
    </div>
  </div>

  <div class="summary-footer" id="summaryFooter" style="display:none; text-align:center; padding:1.2rem; background:rgba(255,255,255,0.03); border-radius:var(--hotel-border-radius); border:1px solid rgba(255,255,255,0.05); margin-top:1rem;">
    <div><span style="color:rgba(255,255,255,0.4); font-size:0.8rem; letter-spacing:2px; text-transform:uppercase;">Total valid votes cast</span></div>
    <div style="font-size:2rem; font-weight:700; color:var(--hotel-gold); font-family:'Playfair Display',serif;" id="totalVotesDisplay">0</div>
    <div style="margin-top:0.3rem; color: rgba(255,255,255,0.15); font-size:0.65rem; letter-spacing:1px;">
      <i class="bi bi-dot"></i> certified by the electoral commission <i class="bi bi-dot"></i>
    </div>
  </div>
</div>

<script>
  // Your backend URL - update this with your deployed Apps Script URL
  var API_URL = 'https://script.google.com/macros/s/AKfycbzcJ5IxMAUS3xKq3UPDve5wJ8SSVYCkJyy4mvVh2s6HLp9habmuh3ZoZsmpposHrOhTFA/exec';

  function escapeHTML(s) { 
    return String(s == null ? '' : s).replace(/[&<"']/g, c => ({'&':'&amp;','<':'&lt;','"':'&quot;',"'":'&#39;'}[c])); 
  }
  
  function escapeAttr(s) { 
    return escapeHTML(s).replace(/'/g, '&#39;'); 
  }

  function getDisplayName(pos) {
    const names = {
      'president': 'President',
      'vice president': 'Vice President',
      'secretary': 'Secretary',
      'treasurer': 'Treasurer',
      'organizer': 'Organizer',
      'welfare': 'Welfare Officer',
      'sports': 'Sports Director',
      'academic': 'Academic Affairs'
    };
    const lower = pos.toLowerCase().trim();
    return names[lower] || pos;
  }

  async function fetchDeclaration() {
    const container = document.getElementById('declarationContainer');
    try {
      // Use the action parameter that your backend expects
      const url = API_URL + '?action=getRealtimeTally&t=' + Date.now();
      console.log('Fetching from:', url);
      
      const response = await fetch(url, {
        method: 'GET',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' }
      });
      
      if (!response.ok) {
        throw new Error('HTTP error! status: ' + response.status);
      }
      
      const data = await response.json();
      console.log('API Response:', data);
      
      // Your backend returns { success: true, data: { ... } }
      if (data && data.success && data.data) {
        renderDeclaration(data.data);
      } else {
        container.innerHTML = renderError((data && data.message) || 'Could not fetch final tally.');
      }
    } catch (error) {
      console.error('Error:', error);
      container.innerHTML = renderError(error.message || String(error));
    }
  }

  function renderError(message) {
    const safe = String(message || '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
    return '<div class="result-card" style="text-align:center;padding:2rem;">' +
      '<i class="bi bi-exclamation-triangle" style="font-size:3rem;color:#e74c3c;display:block;margin-bottom:1rem;"></i>' +
      '<h5 style="color:#fff;margin-bottom:0.5rem;">Cannot load declaration</h5>' +
      '<p style="color:rgba(255,255,255,0.7);">' + safe.replace(/\n/g,'<br>') + '</p>' +
      '<button class="btn-secondary-sm" onclick="fetchDeclaration()"><i class="bi bi-arrow-repeat me-1"></i>Retry</button>' +
      '<div style="margin-top:1rem;color:rgba(255,255,255,0.3);font-size:0.7rem;">Make sure your backend is deployed and accessible.</div></div>';
  }

  function renderDeclaration(tallies) {
    const container = document.getElementById('declarationContainer');
    const footer = document.getElementById('summaryFooter');
    const banner = document.getElementById('celebrationBanner');
    const execTeam = document.getElementById('executiveTeam');
    const execGrid = document.getElementById('executiveGrid');

    console.log('Rendering declaration with data:', tallies);

    if (!tallies || Object.keys(tallies).length === 0) {
      container.innerHTML = '<div class="no-data"><i class="bi bi-inbox"></i><p>No voting data to declare.</p></div>';
      footer.style.display = 'none';
      banner.style.display = 'none';
      execTeam.style.display = 'none';
      return;
    }

    let grandTotal = 0;
    let html = '';
    let winners = {};
    let allCandidates = [];

    // Process each position
    const positionKeys = Object.keys(tallies);
    
    positionKeys.forEach(pos => {
      const positionData = tallies[pos];
      const candidates = Object.keys(positionData.candidates || {});
      
      // Calculate totals and find winner
      let topVotes = 0;
      let winnerName = null;
      let allVotes = [];
      
      candidates.forEach(c => {
        const count = positionData.candidates[c].count || 0;
        const img = positionData.candidates[c].img || 'https://via.placeholder.com/56';
        const program = positionData.candidates[c].program || '';
        allVotes.push({ name: c, count: count, data: positionData.candidates[c] });
        if (count > topVotes) {
          topVotes = count;
          winnerName = c;
        }
      });
      
      // Sort by votes descending
      allVotes.sort((a, b) => b.count - a.count);
      
      const totalVotes = positionData.totalVotes || 0;
      grandTotal += totalVotes;
      
      // Store winner info
      const posLower = pos.toLowerCase().trim();
      if (winnerName) {
        const winnerData = positionData.candidates[winnerName];
        winners[posLower] = {
          name: winnerName,
          program: winnerData?.program || '',
          img: winnerData?.img || 'https://via.placeholder.com/80',
          votes: topVotes,
          totalVotes: totalVotes,
          displayName: getDisplayName(pos),
          allVotes: allVotes
        };
      }

      // Build result card for this position
      html += '<div class="result-card" id="position-' + escapeAttr(pos) + '">' +
        '<div class="result-header">' +
        '<h3><i class="bi bi-trophy me-2" style="color:var(--hotel-gold);"></i>' + escapeHTML(getDisplayName(pos)) + '</h3>' +
        '<span class="total-badge"><i class="bi bi-people me-1"></i>' + 
        candidates.length + ' candidate' + (candidates.length > 1 ? 's' : '') + 
        ' &bull; ' + totalVotes + ' votes</span>' +
        '</div>';

      // Show winner prominently
      if (winnerName && allVotes.length > 0) {
        const winner = allVotes[0];
        const percent = totalVotes > 0 ? ((winner.count / totalVotes) * 100).toFixed(1) : 0;
        html += '<div class="winner-row">' +
          '<img src="' + (winner.data?.img || 'https://via.placeholder.com/56') + '" class="avatar" alt="' + escapeAttr(winner.name) + '">' +
          '<div style="flex:1;">' +
          '<div class="cand-name">' + escapeHTML(winner.name) + ' <span class="winner-badge"><i class="bi bi-crown me-1"></i>WINNER</span></div>' +
          '<div class="cand-program"><i class="bi bi-book me-1"></i>' + escapeHTML(winner.data?.program || '') + '</div>' +
          '</div>' +
          '<div class="result-stats">' +
          '<div class="votes">' + winner.count + '</div>' +
          '<div class="percent">' + percent + '%</div>' +
          '</div></div>';
      }

      // Show other candidates
      allVotes.forEach((cand, idx) => {
        if (idx === 0) return; // skip winner (already shown)
        const percent = totalVotes > 0 ? ((cand.count / totalVotes) * 100).toFixed(1) : 0;
        html += '<div class="candidate-result">' +
          '<img src="' + (cand.data?.img || 'https://via.placeholder.com/56') + '" class="avatar" alt="' + escapeAttr(cand.name) + '">' +
          '<div class="result-info">' +
          '<div class="cand-name">' + escapeHTML(cand.name) + '</div>' +
          '<div class="cand-program"><i class="bi bi-book me-1"></i>' + escapeHTML(cand.data?.program || '') + '</div>' +
          '<div class="progress-hotel"><div class="progress-bar" style="width: ' + percent + '%;"></div></div>' +
          '</div>' +
          '<div class="result-stats">' +
          '<div class="votes">' + cand.count + '</div>' +
          '<div class="percent">' + percent + '%</div>' +
          '</div></div>';
      });

      // Show "Vote for None" if present
      if (positionData.noneCount && positionData.noneCount > 0) {
        const nonePercent = totalVotes > 0 ? ((positionData.noneCount / totalVotes) * 100).toFixed(1) : 0;
        html += '<div class="candidate-result" style="border-left:3px solid #e74c3c;background:rgba(231,76,60,0.04);">' +
          '<div style="width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(231,76,60,0.1);font-size:1.5rem;color:#e74c3c;flex-shrink:0;"><i class="bi bi-x-circle"></i></div>' +
          '<div class="result-info">' +
          '<div class="cand-name" style="color:#e74c3c;">Voted None (Abstained)</div>' +
          '<div class="cand-program">Voter chose not to vote</div>' +
          '<div class="progress-hotel"><div class="progress-bar" style="width: ' + nonePercent + '%;background:linear-gradient(90deg,#e74c3c,#c0392b);"></div></div>' +
          '</div>' +
          '<div class="result-stats">' +
          '<div class="votes" style="color:#e74c3c;">' + positionData.noneCount + '</div>' +
          '<div class="percent">' + nonePercent + '%</div>' +
          '</div></div>';
      }

      html += '</div>';
    });

    container.innerHTML = html;
    footer.style.display = 'block';
    document.getElementById('totalVotesDisplay').textContent = grandTotal;

    // Show celebration banner and executive team
    if (Object.keys(winners).length > 0) {
      banner.style.display = 'block';
      execTeam.style.display = 'block';
      renderExecutiveTeam(winners);
    }
  }

  function renderExecutiveTeam(winners) {
    const grid = document.getElementById('executiveGrid');
    if (!grid) return;

    let execList = [];
    
    // Find President - look for any position containing "president"
    let presidentKey = Object.keys(winners).find(k => k.toLowerCase().includes('president'));
    let president = null;
    let secondPlace = null;
    
    if (presidentKey && winners[presidentKey]) {
      president = winners[presidentKey];
      // Get second place from the president position
      if (president.allVotes && president.allVotes.length > 1) {
        secondPlace = president.allVotes[1];
      }
    }

    // Add President first
    if (president) {
      execList.push({ 
        ...president, 
        role: 'President',
        isPresident: true 
      });
      
      // Add Vice President (second place from president position)
      if (secondPlace) {
        execList.push({ 
          name: secondPlace.name,
          program: secondPlace.data?.program || '',
          img: secondPlace.data?.img || 'https://via.placeholder.com/80',
          votes: secondPlace.count,
          role: 'Vice President',
          isVicePresident: true
        });
      }
    }

    // Add all other position winners (excluding president and vice president)
    Object.keys(winners).forEach(key => {
      if (key.toLowerCase().includes('president')) return;
      if (key.toLowerCase().includes('vice president') || key.toLowerCase().includes('vice-president')) return;
      const displayName = getDisplayName(key);
      execList.push({ ...winners[key], role: displayName });
    });

    // Render executive cards
    grid.innerHTML = '';
    execList.forEach(exec => {
      const card = document.createElement('div');
      card.className = 'executive-card';
      card.innerHTML = `
        <img src="${escapeAttr(exec.img || 'https://via.placeholder.com/80')}" class="exec-avatar" alt="${escapeAttr(exec.name)}">
        <div class="exec-name">${escapeHTML(exec.name)}</div>
        <div class="exec-role">${escapeHTML(exec.role)}</div>
        <div class="exec-program">${escapeHTML(exec.program || '')}</div>
        ${exec.isPresident ? '<div style="margin-top:0.3rem;"><span style="background:var(--hotel-gold);color:#1A1A2E;padding:0.1rem 0.6rem;border-radius:50px;font-size:0.6rem;font-weight:700;"><i class="bi bi-crown me-1"></i>LEADER</span></div>' : ''}
        ${exec.isVicePresident ? '<div style="margin-top:0.3rem;"><span style="background:rgba(201,168,76,0.2);color:var(--hotel-gold);padding:0.1rem 0.6rem;border-radius:50px;font-size:0.6rem;font-weight:700;"><i class="bi bi-star me-1"></i>DEPUTY</span></div>' : ''}
      `;
      grid.appendChild(card);
    });
  }

  // Load on page ready
  window.onload = function() {
    fetchDeclaration();
    // Auto-refresh every 30 seconds
    setInterval(fetchDeclaration, 30000);
  };

  // Expose for retry button
  window.fetchDeclaration = fetchDeclaration;
</script>
</body>
</html>
