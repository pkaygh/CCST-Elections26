<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .candidate-card { cursor: pointer; transition: 0.2s; }
    .candidate-card:hover { transform: translateY(-3px); }
    .selected { border: 3px solid #198754 !important; background-color: #f8f9fa; }
    .card-img-top { height: 200px; object-fit: cover; }
  </style>
</head>
<body class="bg-light py-4">
<div class="container" style="max-width: 800px;">
  <div class="text-center mb-4">
    <h2>Central College of Science and Technology</h2>
    <p class="text-muted">Official SRC Election Voting Portal</p>
  </div>

  <form id="voteForm">
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-primary text-white font-weight-bold">1. Voter Identification</div>
      <div class="card-body row g-3">
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" id="voterName" class="form-control" required placeholder="e.g. Justina Arhin">
        </div>
        <div class="col-md-6">
          <label class="form-label">Student ID Number</label>
          <input type="text" id="studentId" class="form-control" required placeholder="e.g. CCST/RM/20/100">
        </div>
      </div>
    </div>

    <div id="balloutContainer">Loading positions...</div>

    <button type="submit" class="btn btn-success btn-lg w-100 my-4" id="submitBtn">Submit Final Ballot</button>
  </form>
  <div id="msg" class="text-center fw-bold"></div>
</div>

<script>
  let ballotConfig = {};

  window.onload = function() {
    google.script.run.withSuccessHandler(renderBallot).getBallotData();
  };

  function renderBallot(data) {
    ballotConfig = data;
    const container = document.getElementById('balloutContainer');
    container.innerHTML = '';

    Object.keys(data).forEach(position => {
      let html = `<div class="card mb-4 shadow-sm">
        <div class="card-header bg-dark text-white fw-bold">${position}</div>
        <div class="card-body"><div class="row row-cols-1 row-cols-md-2 g-3">`;

      data[position].forEach(cand => {
        html += `
          <div class="col">
            <div class="card candidate-card text-center h-100" onclick="selectCandidate('${position}', '${cand.name}', this)">
              <img src="${cand.img || 'https://via.placeholder.com/200'}" class="card-img-top" alt="${cand.name}">
              <div class="card-body">
                <h5 class="card-title">${cand.name}</h5>
                <p class="card-text text-muted">${cand.program}</p>
              </div>
            </div>
          </div>`;
      });
      html += `</div></div></div>`;
      container.innerHTML += html;
    });
  }

  const selectedVotes = {};
  function selectCandidate(position, candidateName, cardElement) {
    const parent = cardElement.closest('.row');
    parent.querySelectorAll('.candidate-card').forEach(c => c.classList.remove('selected'));
    cardElement.classList.add('selected');
    selectedVotes[position] = candidateName;
  }

  document.getElementById('voteForm').onsubmit = function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Processing Vote...";

    google.script.run.withSuccessHandler(res => {
      const msg = document.getElementById('msg');
      msg.innerText = res.message;
      msg.className = res.success ? "text-success fs-5" : "text-danger fs-5";
      if(res.success) document.getElementById('voteForm').reset();
      btn.disabled = false;
      btn.innerText = "Submit Final Ballot";
    }).submitVotes(
      document.getElementById('voterName').value,
      document.getElementById('studentId').value,
      selectedVotes
    );
  };
</script>
</body>
</html>
